<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اربح من الفيديوهات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:#f4f7f4;padding-bottom:30px}
header{background:#0e4d3a;color:#e8c874;padding:18px;text-align:center;font-size:22px;font-weight:bold}
.box{background:#fff;margin:15px;padding:20px;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:12px}
button{background:#0e4d3a;color:#fff;border:none;width:100%;padding:14px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.btn-gold{background:#e8c874;color:#0e4d3a}
.balance{background:#0e4d3a;color:#fff;text-align:center}
.balance h1{color:#e8c874;font-size:36px;margin:10px 0}
.video{margin-bottom:20px}
iframe{width:100%;height:200px;border-radius:12px;border:none}
.hidden{display:none}
</style>
</head>
<body>
<header>اربح من الفيديوهات 💰</header>

<div class="box" id="loginBox">
<h3>تسجيل الدخول</h3>
<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف مثلا 06xxxxxxxx">
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">
<div class="box balance">
<p>الرصيد ديالك</p>
<h1><span id="points">0.00</span> درهم</h1>
<p>فيديوهات اليوم: <span id="count">0</span> / 3</p>
</div>

<div class="box">
<h3>فيديوهات اليوم</h3><br>
<div class="video">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
<button class="btn-gold" onclick="watch(this)">شاهدت الفيديو - اربح 0.10 درهم</button>
</div>
<div class="video">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
<button class="btn-gold" onclick="watch(this)">شاهدت الفيديو - اربح 0.10 درهم</button>
</div>
<div class="video">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
<button class="btn-gold" onclick="watch(this)">شاهدت الفيديو - اربح 0.10 درهم</button>
</div>
</div>

<div class="box">
<h3>طلب السحب</h3>
<p>الحد الأدنى للسحب هو 20 درهم</p><br>
<button onclick="withdraw()">اطلب فلوسك عبر واتساب</button>
</div>
</div>

<script>
let balance = parseFloat(localStorage.getItem('balance')||0);
let count = parseInt(localStorage.getItem('count')||0);
let user = localStorage.getItem('user');

function login(){
  let n=document.getElementById('name').value;
  let p=document.getElementById('phone').value;
  if(n.length<3 || p.length<10){alert('عمر الاسم ورقم الهاتف صحيح');return}
  localStorage.setItem('user',n+' - '+p);
  user=n; show();
}
function show(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  update();
}
function update(){
  document.getElementById('points').innerText=balance.toFixed(2);
  document.getElementById('count').innerText=count;
}
function watch(btn){
  if(count>=3){alert('ساليتي فيديوهات اليوم، رجع غدا');return}
  balance+=0.10; count++;
  localStorage.setItem('balance',balance);
  localStorage.setItem('count',count);
  btn.disabled=true; btn.innerText='تمت إضافة 0.10 درهم ✅';
  update();
}
function withdraw(){
  if(balance<20){alert('خاصك توصل لـ 20 درهم أولا. عندك دابا '+balance.toFixed(2));return}
  window.open('https://wa.me/212653242472?text='+encodeURIComponent('سلام، أنا '+user+' وصلت لـ '+balance.toFixed(2)+' درهم وبغيت نسحب فلوسي'))
}
if(user) show();
</script>
</body>
</html>
